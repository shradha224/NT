<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Created Successfully | Navya</title>
    <link rel="stylesheet" href="qr-generated.css">
</head>

<body>

    <!-- Top-left Navya Logo -->
    <header class="top-header">
        <div class="brand">
            <div class="brand-icon">
                <span></span>
                <span></span>
            </div>
            <span class="brand-name">Navya</span>
        </div>
    </header>


    <!-- Main Content -->
    <main class="page-container">

        <section class="success-card">

            <!-- Success Icon -->
            <div class="success-icon">
                <span class="checkmark">✓</span>
            </div>

            <!-- Heading -->
            <h1>Batch Created Successfully</h1>

            <!-- Batch ID -->
            <p class="batch-id">
                Batch ID: <span>TOM-024</span>
            </p>


            <!-- QR Container -->
            <div class="qr-container">

                <div class="qr-image-wrapper">
                    <!-- Replace this with your actual generated QR image -->
                    <img
                        src="tom-024-qr.png"
                        alt="QR Code for Batch TOM-024"
                        class="qr-image"
                    >
                </div>

                <p class="qr-description">
                    Attach this QR code to the physical batch.
                </p>

            </div>


            <!-- Download QR -->
            <button class="download-btn" onclick="downloadQR()">
                <span class="download-icon">↓</span>
                <span>Download QR</span>
            </button>


            <!-- Print QR -->
            <button class="print-btn" onclick="printQR()">
                <span class="print-icon">▣</span>
                <span>Print QR</span>
            </button>


            <!-- Back -->
            <a href="farmer-dashboard.html" class="back-link">
                <span>←</span>
                <span>Back to Dashboard</span>
            </a>

        </section>

    </main>


    <script>
        function downloadQR() {
            const qr = document.querySelector(".qr-image");

            const link = document.createElement("a");
            link.href = qr.src;
            link.download = "TOM-024-QR.png";

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function printQR() {
            const qr = document.querySelector(".qr-image");

            const printWindow = window.open("", "_blank");

            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Print QR - TOM-024</title>
                    <style>
                        body {
                            margin: 0;
                            min-height: 100vh;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            font-family: Arial, sans-serif;
                        }

                        .print-container {
                            text-align: center;
                        }

                        img {
                            width: 300px;
                            height: 300px;
                            object-fit: contain;
                        }

                        h2 {
                            margin-top: 20px;
                        }
                    </style>
                </head>

                <body>
                    <div class="print-container">
                        <img src="${qr.src}" alt="QR Code">
                        <h2>Batch ID: TOM-024</h2>
                    </div>

                    <script>
                        window.onload = function() {
                            window.print();
                        }
                    <\/script>
                </body>
                </html>
            `);

            printWindow.document.close();
        }
    </script>

</body>
</html>
